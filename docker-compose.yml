services:
  postgres:
    image: postgres:16
    container_name: myaiagent-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: myaiagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d myaiagent"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
